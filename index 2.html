<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050705">
  <meta name="description" content="Contagem regressiva para Terra Ameaçada 3 — 31 de dezembro de 2026 às 14h (Brasília).">
  <title>Terra Ameaçada 3 — Contagem Regressiva</title>
  <style>
    :root {color-scheme:dark;--green:#009b3a;--text:#e8f4eb;--bg:#050705}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;font-style:italic;-webkit-font-smoothing:antialiased}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 47%,rgba(0,155,58,.14),transparent 56%)}
    .page{position:relative;min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:65px 18px 85px}
    .main{text-align:center;width:100%;max-width:920px}
    h1{font-size:clamp(1.7rem,5.5vw,3.35rem);font-weight:700;letter-spacing:.045em;margin:0 0 12px;color:#f5faf6}
    .sub{font-size:clamp(.78rem,2.2vw,1.06rem);letter-spacing:.13em;color:#9cae9f;margin:0 0 45px}
    .counter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,2vw,23px);align-items:start}
    .slot{min-width:0}
    .value{font-size:clamp(2.7rem,11vw,7.6rem);line-height:1;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-.04em;text-shadow:0 0 38px rgba(0,155,58,.15)}
    .unit{font-size:clamp(.7rem,2.1vw,1.05rem);color:#afc8b5;letter-spacing:.11em;margin-top:18px}
    .launch{min-height:1.5em;margin:30px 0 0;color:var(--green);font-size:1.2rem}
    .channel{display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;margin-top:24px;padding:8px;border-radius:16px;background:rgba(0,155,58,.12);border:1px solid rgba(0,155,58,.65);transition:transform .2s,background .2s;box-shadow:0 0 22px rgba(0,155,58,.07)}
    .channel:hover,.channel:focus-visible{transform:translateY(-3px);background:rgba(0,155,58,.24);outline:2px solid var(--green);outline-offset:3px}
    .channel img{display:block;width:48px;height:48px;image-rendering:pixelated}
    footer{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:14px;right:14px;text-align:center;color:#728477;font-size:clamp(.59rem,1.5vw,.72rem);line-height:1.6}
    @media(max-width:390px){.page{padding-left:11px;padding-right:11px}.counter{gap:3px}.unit{letter-spacing:.02em}.channel{margin-top:17px}.sub{margin-bottom:35px}}
    @media(prefers-reduced-motion:reduce){.channel{transition:none}}
  </style>
</head>
<body>
  <div class="page">
    <main class="main">
      <h1>TERRA AMEAÇADA 3</h1>
      <p class="sub">31.12.2026 · 14:00 · HORÁRIO DE BRASÍLIA</p>
      <div class="counter" role="timer" aria-label="Tempo restante para o lançamento">
        <div class="slot"><div id="days" class="value">00</div><div class="unit">DIAS</div></div>
        <div class="slot"><div id="hours" class="value">00</div><div class="unit">HORAS</div></div>
        <div class="slot"><div id="minutes" class="value">00</div><div class="unit">MINUTOS</div></div>
        <div class="slot"><div id="seconds" class="value">00</div><div class="unit">SEGUNDOS</div></div>
      </div>
      <p class="launch" id="launch" aria-live="polite"></p>
      <a class="channel" href="https://www.youtube.com/@peagaahmc" target="_blank" rel="noopener noreferrer" aria-label="Visitar o canal do Peagaah no YouTube" title="Canal do Peagaah no YouTube">
        <img src="https://mc-heads.net/avatar/Peagaah/96" alt="Cabeça da skin do Peagaah" width="48" height="48" loading="lazy">
      </a>
    </main>
    <footer>oi, sou eu o Peagaah falando, queria avisar que esse site foi inteiramente feito por IA.</footer>
  </div>
  <script>
    // 31/12/2026, 14h de Brasília (UTC−03:00). O relógio se ajusta ao dispositivo do visitante.
    const target = new Date('2026-12-31T14:00:00-03:00').getTime();
    const nodes = ['days','hours','minutes','seconds'].map(id=>document.getElementById(id));
    const pad=n=>String(n).padStart(2,'0');
    function refresh(){
      let remaining=Math.max(0,Math.floor((target-Date.now())/1000));
      const days=Math.floor(remaining/86400);remaining%=86400;
      const hours=Math.floor(remaining/3600);remaining%=3600;
      const minutes=Math.floor(remaining/60);const seconds=remaining%60;
      [days,hours,minutes,seconds].forEach((n,i)=>nodes[i].textContent=pad(n));
      if(Date.now()>=target)document.getElementById('launch').textContent='O TERRA AMEAÇADA 3 JÁ ESTREOU.';
    }
    refresh();setInterval(refresh,1000);
  </script>
</body>
</html>
